name: Build TEF6686 ESP32

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: PlatformIO ESP32 compile check
runs-on: ubuntu-latest
timeout-minutes: 20
steps:
- name: Check out source
uses: actions/checkout@v4

- name: Set up Python  
    uses: actions/setup-python@v5  
    with:  
      python-version: "3.x"  

  - name: Install PlatformIO  
    run: python -m pip install --upgrade platformio  

  - name: Compile firmware (no upload)  
    run: pio run -e esp32

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: PlatformIO ESP32 compile check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compile firmware (no upload)
        run: pio run -e esp32
